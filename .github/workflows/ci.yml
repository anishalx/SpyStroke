name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install xvfb (headless X server for pynput)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        # pynput requires an X display even to import on Linux; run the suite
        # under a virtual framebuffer on headless runners.
        run: xvfb-run -a python -m pytest tests/ -v

      - name: Verify packages compile
        run: |
          python -m py_compile spystroke/*.py email/*.py telegram/*.py